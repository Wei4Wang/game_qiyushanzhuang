<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泣雨山庄·白月光的葬礼 — 沉浸式剧本杀</title>
<style>
  :root{
    --bg:#0a0a12; --bg2:#10101c; --panel:#151527; --panel2:#1c1c33; --line:#2a2a45;
    --text:#e8e6f0; --muted:#8f8ba8; --blood:#c81e3c; --blood2:#8f1226;
    --gold:#e8c36a; --moon:#cfe0ff; --green:#4dd08a; --blue:#3b82f6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased}
  .screen{display:none;min-height:100vh}
  .screen.active{display:block}
  button{font-family:inherit;cursor:pointer;border:none;outline:none}
  .btn{background:linear-gradient(135deg,var(--blood),var(--blood2));color:#fff;padding:11px 24px;border-radius:8px;font-size:14px;letter-spacing:2px;transition:.2s;box-shadow:0 4px 18px rgba(200,30,60,.35)}
  .btn:hover{transform:translateY(-2px)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);box-shadow:none}
  .btn.ghost:hover{color:var(--text);border-color:var(--gold)}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
  .btn.small{padding:7px 14px;font-size:12px}
  .btn.gold{background:linear-gradient(135deg,#b8913a,#8a6d28);box-shadow:0 4px 18px rgba(232,195,106,.3)}
  .tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:9px;letter-spacing:1px}
  .tag.L1{background:rgba(232,195,106,.15);color:var(--gold);border:1px solid rgba(232,195,106,.4)}
  .tag.L2{background:rgba(78,200,255,.14);color:#6cc7ff;border:1px solid rgba(78,200,255,.4)}
  .tag.L3{background:rgba(124,92,255,.15);color:#a78bfa;border:1px solid rgba(124,92,255,.4)}
  .tag.L4{background:rgba(255,140,80,.15);color:#ffa060;border:1px solid rgba(255,140,80,.4)}
  .tag.L5{background:rgba(200,30,60,.18);color:#ff7a93;border:1px solid rgba(200,30,60,.5)}

  #opening{position:relative;background:radial-gradient(ellipse at 50% 30%,#1a1a33 0%,#0a0a12 70%)}
  .rain{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .drop{position:absolute;top:-20px;width:1px;background:linear-gradient(transparent,rgba(180,190,230,.5));animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(110vh)}}
  .fog{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 110%,rgba(60,70,120,.25),transparent 60%),radial-gradient(ellipse at 20% 100%,rgba(40,50,90,.2),transparent 55%)}
  .opening-center{position:relative;z-index:3;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
  .opening-kicker{color:var(--muted);letter-spacing:8px;font-size:13px;opacity:0;animation:fadeup 1.4s .3s forwards}
  .opening-title{font-size:clamp(36px,7vw,68px);letter-spacing:6px;font-weight:700;margin:16px 0 6px;color:#fff;text-shadow:0 0 30px rgba(207,224,255,.35);opacity:0;animation:fadeup 1.6s .7s forwards}
  .opening-title .blood{color:var(--blood);text-shadow:0 0 34px rgba(200,30,60,.6)}
  .opening-sub{font-size:15px;color:var(--muted);letter-spacing:4px;opacity:0;animation:fadeup 1.6s 1.1s forwards}
  .opening-meta{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;opacity:0;animation:fadeup 1.4s 1.4s forwards}
  .opening-meta span{border:1px solid var(--line);padding:7px 15px;border-radius:20px;font-size:12px;color:var(--muted)}
  .opening-enter{margin-top:40px;opacity:0;animation:fadeup 1.4s 1.8s forwards}
  .opening-enter .btn{font-size:16px;padding:14px 42px;letter-spacing:4px}
  @keyframes fadeup{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

  #draw .wrap{max-width:560px;margin:0 auto;padding:50px 20px}
  .draw-stage{text-align:center;padding:50px 20px}
  .draw-card{width:170px;height:235px;margin:26px auto;background:var(--panel);border:2px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:700;color:var(--muted);transition:.4s;position:relative;overflow:hidden}
  .draw-card.cycling{animation:shake .5s infinite}
  @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
  .draw-card .mono{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:#fff}
  .draw-hint{color:var(--muted);font-size:14px;letter-spacing:2px}
  .script-panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;display:none}
  .script-panel h2{font-size:20px}
  .script-panel .role{color:var(--muted);font-size:13px;margin-top:4px}
  .script-panel h4{color:var(--gold);font-size:12px;letter-spacing:2px;margin:16px 0 7px}
  .script-panel p{font-size:14px;line-height:1.9;color:var(--text)}
  .script-panel .warn{color:#ff7a93}
  .script-panel .secret-box{background:rgba(200,30,60,.06);border:1px dashed rgba(200,30,60,.35);border-radius:10px;padding:14px;margin-top:6px}

  .topbar{position:sticky;top:0;z-index:20;background:rgba(10,10,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:11px 18px;flex-wrap:wrap}
  .topbar .logo{font-size:15px;font-weight:700;letter-spacing:2px;color:#fff;white-space:nowrap}
  .topbar .logo small{color:var(--blood);margin-left:5px}
  .me-pill{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);padding:4px 11px;border-radius:16px;font-size:12px;color:var(--muted);white-space:nowrap}
  .me-pill .mono{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
  .me-pill b{color:#fff}
  .ap-pill{background:var(--panel2);border:1px solid var(--line);padding:4px 12px;border-radius:16px;font-size:12px;color:var(--muted);white-space:nowrap}
  .ap-pill b{color:var(--blue)}
  .round-pill{background:var(--panel2);border:1px solid var(--line);padding:4px 12px;border-radius:16px;font-size:12px;color:var(--muted)}
  .round-pill b{color:var(--gold)}
  .timer-wrap{display:flex;align-items:center;gap:8px;margin-left:auto}
  .timer{font-size:23px;font-weight:700;letter-spacing:2px;font-variant-numeric:tabular-nums;color:var(--gold)}
  .timer.danger{color:var(--blood);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.4}}

  .nav{display:flex;gap:2px;padding:10px 16px 0;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--bg)}
  .nav button{background:transparent;color:var(--muted);padding:9px 13px;font-size:13px;letter-spacing:1px;border-bottom:2px solid transparent}
  .nav button.active{color:#fff;border-bottom-color:var(--blood)}
  .nav button:hover{color:var(--text)}

  .main{max-width:1120px;margin:0 auto;padding:22px 18px 80px}
  .section-title{font-size:20px;font-weight:700;letter-spacing:3px;margin-bottom:6px}
  .section-title .num{color:var(--blood)}
  .section-sub{color:var(--muted);font-size:12px;margin-bottom:18px;letter-spacing:1px}
  .dm-note{background:linear-gradient(135deg,rgba(200,30,60,.08),rgba(124,92,255,.06));border:1px solid rgba(200,30,60,.25);border-left:3px solid var(--blood);padding:11px 15px;border-radius:8px;color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.7}
  .dm-note b{color:var(--gold)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .progress{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--gold),var(--blood));transition:width .4s}

  .chapter{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;background:var(--panel)}
  .chapter h3{color:var(--gold);font-size:15px;letter-spacing:2px;margin-bottom:10px}
  .chapter p{font-size:14px;line-height:1.9;color:var(--text)}
  .chapter.locked{opacity:.5;filter:blur(2px);pointer-events:none}

  .chars-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .char-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .char-card.self{border-color:var(--c)}
  .char-card .head{height:84px;background:linear-gradient(135deg,var(--c),transparent);display:flex;align-items:center;gap:12px;padding:0 16px}
  .char-card .mono{width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.35);border:2px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;flex-shrink:0}
  .char-card .who{flex:1}
  .char-card .who .nm{font-size:16px;font-weight:700;color:#fff}
  .char-card .who .role{font-size:11px;color:var(--muted);margin-top:2px}
  .char-card .body{padding:12px 16px;font-size:13px;color:var(--muted);line-height:1.7;min-height:60px}
  .char-card .susp{margin:0 16px 12px}
  .char-card .susp .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px}
  .char-card .foot{padding:9px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}

  .search-status{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .stat{background:var(--panel2);border:1px solid var(--line);padding:9px 16px;border-radius:10px;font-size:13px}
  .stat b{color:var(--gold);font-size:19px;margin:0 3px}
  .scenes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px}
  .scene-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .scene-card .sh{padding:11px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
  .scene-card .sh .idx{width:28px;height:28px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--gold)}
  .scene-card .sh .nm{font-weight:600;font-size:13px}
  .scene-card .sh .st{font-size:10px;color:var(--muted);margin-top:2px}
  .scene-card .clues{padding:6px 12px;max-height:250px;overflow-y:auto}
  .clue{font-size:12px;line-height:1.65;padding:7px 0;border-bottom:1px dashed var(--line);color:var(--muted)}
  .clue:last-child{border-bottom:none}
  .clue.revealed{color:var(--text)}
  .clue.locked{display:flex;align-items:center;gap:7px}
  .scene-card .foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}

  .collect-bar{margin-bottom:18px}
  .collect-bar .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
  .frag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .frag{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px;font-size:12px;line-height:1.7}
  .frag h4{color:var(--gold);font-size:12px;margin-bottom:6px}
  .frag.locked{opacity:.35}
  .frag.locked p{filter:blur(3px)}

  .interro-layout{display:grid;grid-template-columns:190px 1fr;gap:14px}
  @media(max-width:760px){.interro-layout{grid-template-columns:1fr}}
  .npc-list{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px;height:fit-content}
  .npc-list button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;color:var(--muted);padding:8px 9px;border-radius:8px;font-size:13px;margin-bottom:3px}
  .npc-list button.active{background:var(--panel2);color:#fff}
  .npc-list .mono{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
  .npc-list .done{color:var(--green);margin-left:auto;font-size:10px}
  .interro-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-height:360px}
  .topic-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .topic-btn{font-size:12px;padding:8px 13px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .topic-btn:hover{border-color:var(--gold);color:var(--gold)}
  .topic-btn.asked{opacity:.5}
  .say-box{background:var(--panel2);border-left:3px solid var(--gold);border-radius:8px;padding:12px 14px;margin-bottom:12px}
  .say-box .spk{font-size:11px;color:var(--gold);margin-bottom:5px}
  .say-box p{font-size:13px;line-height:1.8;color:var(--text)}
  .say-box.truth{border-left-color:var(--green)}
  .say-box.truth .spk{color:var(--green)}
  .confront{background:rgba(200,30,60,.08);border:1px dashed rgba(200,30,60,.5);border-radius:8px;padding:11px 13px;margin-bottom:12px}
  .confront p{font-size:12px;color:var(--muted);margin-bottom:9px}
  .truth-frag{background:rgba(77,208,138,.07);border:1px solid rgba(77,208,138,.3);border-radius:8px;padding:11px 13px;font-size:12px;line-height:1.7;color:var(--green);margin-top:8px}

  .timeline{position:relative;padding-left:26px}
  .timeline::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .tl-item{position:relative;margin-bottom:16px}
  .tl-item::before{content:"";position:absolute;left:-24px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--blood);border:2px solid var(--bg)}
  .tl-item.hide::before{background:#64748b}
  .tl-item .tt{font-weight:700;color:var(--gold);font-size:13px}
  .tl-item .ev{color:var(--text);font-size:13px;margin-top:3px;line-height:1.7}
  .tl-item .blur{filter:blur(4px);opacity:.7;user-select:none}
  .tl-item .unlocked{color:var(--blood)}

  .mech-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .mech{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
  .mech h4{font-size:13px;color:var(--gold);margin-bottom:5px}
  .mech p{font-size:11px;color:var(--muted);line-height:1.6}
  .mech .idx{display:inline-block;font-size:10px;color:var(--blood);margin-right:6px}
  .tab-switch{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tab-switch button{font-size:12px;padding:8px 16px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .tab-switch button.active{color:#fff;border-color:var(--gold);background:rgba(232,195,106,.1)}

  .notes-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.notes-grid{grid-template-columns:1fr}}
  textarea{width:100%;min-height:220px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;color:var(--text);font-size:13px;line-height:1.7;resize:vertical}
  textarea:focus{outline:none;border-color:var(--gold)}

  .vote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:11px}
  .vote-opt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 10px;text-align:center;cursor:pointer;transition:.2s;font-size:13px;color:var(--muted)}
  .vote-opt:hover{border-color:var(--gold);color:var(--text)}
  .vote-opt.selected{border-color:var(--blood);background:var(--blood2);color:#fff}
  .vote-opt .mono-sm{width:38px;height:38px;border-radius:50%;margin:0 auto 7px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;border:2px solid currentColor}
  .vote-opt small{display:block;font-size:10px;color:var(--muted);margin-top:3px}
  .vote-submit{margin-top:18px;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
  .redeem-box{margin-top:14px;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .redeem-box label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:9px;cursor:pointer}
  .redeem-box input{width:16px;height:16px;accent-color:var(--blood)}
  .redeem-box.disabled{opacity:.45}

  .endings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:24px}
  .ending{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;position:relative;overflow:hidden}
  .ending .badge{position:absolute;top:12px;right:12px;font-size:10px;padding:3px 9px;border-radius:9px}
  .ending .e-title{font-size:17px;font-weight:700;margin-bottom:5px}
  .ending .e-type{font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:12px}
  .ending .e-text{font-size:12px;line-height:1.8;color:var(--muted)}
  .ending .e-trigger{margin-top:12px;font-size:11px;color:var(--gold);line-height:1.6;border-top:1px dashed var(--line);padding-top:10px}
  .ending.unlocked{border-color:var(--blood);box-shadow:0 0 26px rgba(200,30,60,.3)}
  .ending .badge.BE{background:rgba(200,30,60,.2);color:#ff7a93}
  .ending .badge.HE{background:rgba(77,208,138,.18);color:var(--green)}
  .ending .badge.HIDE{background:rgba(232,195,106,.18);color:var(--gold)}
  .ending .badge.ALL{background:rgba(124,92,255,.18);color:#a78bfa}
  .score-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px;text-align:center}
  .score-box .grade{font-size:42px;font-weight:700;color:var(--gold)}
  .score-box .detail{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.8}
  .recap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
  .recap h3{font-size:16px;color:var(--gold);letter-spacing:2px;margin-bottom:12px}
  .recap .r-block{margin-bottom:12px}
  .recap .r-block h4{color:var(--blood);font-size:13px;letter-spacing:1px;margin-bottom:5px}
  .recap .r-block p{font-size:13px;line-height:1.8;color:var(--text)}

  .footer{padding:26px;text-align:center;color:var(--muted);font-size:11px;letter-spacing:1px;border-top:1px solid var(--line)}
</style>
</head>
<body>

<section class="screen active" id="opening">
  <div class="rain" id="rain"></div>
  <div class="fog"></div>
  <div class="opening-center">
    <div class="opening-kicker">一场关于爱与罪的暴风雨夜</div>
    <div class="opening-title">泣雨山庄<span class="blood">·</span>白月光的葬礼</div>
    <div class="opening-sub">本格爱情悬疑 · 沉浸式单人剧本杀 · 15万字剧本 · 真相由你亲手揭开</div>
    <div class="opening-meta">
      <span>20 行动点</span><span>6 张选票</span><span>票换行动点 · 护盾博弈</span><span>100 搜证点</span><span>100 故事碎片</span><span>60 分钟</span>
    </div>
    <div class="opening-enter"><button class="btn" onclick="startDraw()">抽取你的身份</button></div>
  </div>
</section>

<section class="screen" id="draw">
  <div class="wrap">
    <div class="draw-stage" id="drawStage">
      <div class="draw-hint" id="drawHint">正在洗牌，命运由抽签决定……</div>
      <div class="draw-card" id="drawCard">?</div>
      <div class="draw-hint" id="drawHint2" style="display:none">你抽到了这个身份——凶手，永远不会是你。</div>
    </div>
    <div class="script-panel" id="scriptPanel"></div>
  </div>
</section>

<section class="screen" id="game">
  <div class="topbar">
    <div class="logo">泣雨山庄<small>沉浸版</small></div>
    <div class="me-pill" id="mePill"></div>
    <div class="ap-pill">行动点 <b id="apVal">20</b></div>
    <div class="round-pill">选票 <b id="voteVal">6</b></div>
    <div class="round-pill">凶手护盾 <b id="shieldVal">0</b></div>
    <div class="round-pill">轮次 <b id="roundLabel">第一轮</b></div>
    <div class="timer-wrap">
      <button class="btn ghost small" id="btnTimer" onclick="toggleTimer()">开始计时</button>
      <div class="timer" id="timer">60:00</div>
    </div>
  </div>
  <div class="nav" id="nav"></div>
  <div class="main" id="mainPane"></div>
  <div class="footer">泣雨山庄·白月光的葬礼 — 沉浸式单人剧本杀 · 凶手从不发到你手里 · 15万字剧本 · 100搜证 · 100碎片 · 50机制</div>
</section>

<script src="content.js"></script>
<script>
const D = window.GAME_DATA;
const ALL = D.characters;
const SCENES = D.scenes;
const FRAGMENTS = D.fragments;
const TIMELINE = D.timeline;
const MECHANICS = D.mechanics;
const TOPICS = D.topics;

let CLUES = [];
SCENES.forEach((s, si) => s.clues.forEach((c) => CLUES.push({...c, scene:s.name, sceneIdx:si})));

const SUSPICION = {
  e_monitor:{xinxin:30}, e_photo:{xinxin:20}, e_ointment:{xinxin:30}, e_revenge:{xinxin:35},
  e_sparekey:{xinxin:40}, e_scrap:{xinxin:25}, e_diary2:{xinxin:15},
  e_badge:{weiwei:25}, e_recording:{guzhao:25, weiwei:15}, e_notes:{weiwei:15,enen:15,shenmo:15,guzhao:15},
  e_photo2:{enen:25}, e_hairpin:{chenchen:20}, e_knife2:{guzhao:15}, e_manuscript:{weiwei:15},
};

const TABS = [
  ['script','剧本'], ['chars','人物'], ['search','搜证'], ['story','故事'],
  ['interro','审讯'], ['timeline','时间线'], ['codex','图鉴'], ['vote','投票'], ['ending','结局']
];

const ENDINGS = [
  {id:'e1', title:'白月光的陨落', type:'BE · 真凶逃脱', badge:'BE', text:'白蔷薇的护盾挡住了你的指控。她冷冷扫了你们一眼，转身走进雨幕。此后数月，山庄众人一个接一个「失踪」，警方只在后山找到一束枯萎的白玫瑰。', trigger:'触发：投给「白蔷薇」的票数 ≤ 凶手护盾数，或根本没投真凶。'},
  {id:'e2', title:'第七封信', type:'HE · 真相大白', badge:'HE', text:'你的票数压过了她的护盾。白蔷薇沉默良久，摘下面纱，露出三年前那场大火留下的伤疤，平静认罪：「苏念到最后都在求我自首。」她，就是死去的白月光芯芯，苏念的亲妹妹。', trigger:'触发：投给「白蔷薇」的票数 > 凶手护盾数。'},
  {id:'e3', title:'一丘之貉', type:'全员定罪', badge:'ALL', text:'多数票投向了「五人都有罪」。五名背负旧罪的人全部入狱，晨晨无罪释放，但芯芯杀姐的真相被掩埋。', trigger:'触发：投「五人都有罪」≥ 3 票。'},
  {id:'e4', title:'救赎', type:'隐藏 · 晨晨线', badge:'HIDE', text:'你以晨晨的身份，集齐第七封信与复仇笔记，选择感化而非指认。白蔷薇卸下伪装，主动自首。暴雨停歇，天边透出月光。', trigger:'触发：你是晨晨 + 集齐第七封信与复仇笔记 + 勾选感化。'}
];

const state = {
  playerId:null, round:1, ap:20, maxAp:99, apTick:0,
  votes:6, shields:0, ballot:{},
  cluesFound:new Set(), fragFound:new Set(), chapterRead:1,
  asked:{}, confronts:new Set(), suspicion:{}, truthUnlocked:false,
  flagged:new Set(), lastStory:null, lastClueId:null,
  vote:null, redeem:false,
  timerSeconds:3600, timerRunning:false, timerInt:null,
  curTab:'script', curNPC:null
};

const $ = id => document.getElementById(id);
const me = () => ALL.find(c=>c.id===state.playerId);
const cById = id => ALL.find(c=>c.id===id);
const clueById = id => CLUES.find(c=>c.id===id);
const ENDING_FULL = D.endingScenes || {};

function flagToggle(id){ if(state.flagged.has(id)) state.flagged.delete(id); else state.flagged.add(id); render(); }
function flagBtn(id){
  const f=state.flagged.has(id);
  return `<button class="btn ghost small" style="margin-top:8px" onclick="event.stopPropagation();flagToggle('${id}')">${f?'已标记存疑（点击取消）':'标记存疑（疑似假信息）'}</button>`;
}
function truthScore(){
  let seen=0, correct=0;
  [...state.cluesFound].forEach(id=>{ const c=clueById(id); if(!c) return; seen++; if(state.flagged.has(id) === (c.truth===false)) correct++; });
  [...state.fragFound].forEach(i=>{ const f=FRAGMENTS[i]; if(!f) return; seen++; if(state.flagged.has(f.id) === (f.truth===false)) correct++; });
  return {seen, correct, pct: seen?Math.round(correct/seen*100):0};
}

function initRain(){ const r=$('rain'); for(let i=0;i<90;i++){ const d=document.createElement('div'); d.className='drop'; d.style.left=Math.random()*100+'%'; d.style.height=(8+Math.random()*16)+'px'; d.style.animationDuration=(0.5+Math.random()*0.9)+'s'; d.style.animationDelay=(Math.random()*2)+'s'; d.style.opacity=0.3+Math.random()*0.5; r.appendChild(d);} }
initRain();
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); window.scrollTo(0,0); }

function startDraw(){
  show('draw');
  $('drawStage').style.display='block'; $('scriptPanel').style.display='none';
  $('drawHint').textContent='正在洗牌，命运由抽签决定……'; $('drawHint').style.display='block'; $('drawHint2').style.display='none';
  const card=$('drawCard'); card.className='draw-card cycling';
  const pool=ALL.filter(c=>c.canAssign); let i=0;
  const cyc=setInterval(()=>{ const t=pool[i%pool.length]; i++; card.innerHTML=`<div class="mono" style="border:2px solid ${t.color}">${t.name[0]}</div>`; },110);
  setTimeout(()=>{ clearInterval(cyc);
    const pick=pool[Math.floor(Math.random()*pool.length)];
    state.playerId=pick.id;
    ALL.forEach(c=>state.suspicion[c.id]=0);
    card.className='draw-card';
    card.innerHTML=`<div class="mono" style="border:2px solid ${pick.color}">${pick.name[0]}</div><div style="position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:17px;font-weight:700;color:#fff">${pick.name}</div>`;
    $('drawHint').style.display='none'; $('drawHint2').style.display='block';
    renderScriptPanel();
  },2500);
}

function renderScriptPanel(){
  const c=me(); if(!c) return;
  $('scriptPanel').style.display='block';
  $('scriptPanel').innerHTML=`
    <h2>${c.name} <span style="font-size:13px;color:${c.color}">${c.gender} · ${c.age}岁</span></h2><div class="role">${c.role}</div>
    <h4>公开身份</h4><p>${c.public}</p>
    <div class="secret-box"><h4>你的秘密（只有你知道）</h4><p class="warn">${c.secret}</p>
    <h4>你的动机</h4><p>${c.motive}</p><h4>你的任务</h4><p>${c.task}</p><h4>DM 提示</h4><p>${c.tip}</p></div>
    <p style="margin-top:14px;color:var(--muted)">—— 牢记：凶手不会是你。你有 20 行动点、6 张选票；可用票换行动点，但每换一次，凶手就多一层护盾，最终定罪会更难。</p>
    <div style="margin-top:16px;text-align:center"><button class="btn" onclick="enterGame()">我已读完，进入大厅</button></div>`;
}

function enterGame(){ show('game'); state.curTab='script'; buildNav(); render(); }

function buildNav(){
  const nav=$('nav'); nav.innerHTML='';
  TABS.forEach(([id,label])=>{
    const b=document.createElement('button');
    b.textContent=label; b.dataset.tab=id;
    b.className=id===state.curTab?'active':'';
    b.onclick=()=>{ state.curTab=id; buildNav(); render(); };
    nav.appendChild(b);
  });
}
function render(){
  $('mePill').innerHTML = me()?`<span class="mono" style="border:2px solid ${me().color}">${me().name[0]}</span><span>我是</span><b>${me().name}</b>`:'';
  $('apVal').textContent=state.ap;
  const vv=$('voteVal'); if(vv) vv.textContent=state.votes;
  const sv=$('shieldVal'); if(sv) sv.textContent=state.shields;
  $('roundLabel').textContent=state.round===1?'第一轮':'第二轮';
  const pane=$('mainPane');
  const map={script:renderScript, chars:renderChars, search:renderSearch, story:renderStory, interro:renderInterro, timeline:renderTimeline, codex:renderCodex, vote:renderVote, ending:renderEnding};
  pane.innerHTML = map[state.curTab]();
}

function scriptHtml(text){
  const lines=text.split('\n');
  let h='';
  lines.forEach(ln=>{
    const t=ln.trim();
    if(!t) return;
    if(t.startsWith('═')){ h+='<hr style="border:none;border-top:1px solid var(--line);margin:14px 0">'; return; }
    if(t.startsWith('【') && t.endsWith('】')){ h+=`<h3 style="color:var(--gold);font-size:15px;letter-spacing:2px;margin:16px 0 8px">${t}</h3>`; return; }
    if(t.startsWith('■')){ h+=`<h4 style="color:var(--blood);font-size:13px;margin:12px 0 6px">${t}</h4>`; return; }
    h+=`<p style="font-size:14px;line-height:2;color:var(--text);margin:4px 0">${t}</p>`;
  });
  return h;
}

function renderScript(){
  const c=me();
  let html=`<div class="section-title"><span class="num">01</span> 我的剧本 · ${c.name}</div>
    <div class="section-sub">${c.role}｜${c.gender}｜${c.age}岁｜你的完整角色剧本，全文展开（约 ${c.fullScript.length} 字）。</div>
    <div class="dm-note"><b>提示：</b>这是只属于你的完整剧本。别人的剧本你永远看不到，只能靠搜证、审讯与故事采集去拼出真相。</div>
    <div class="card">${scriptHtml(c.fullScript)}</div>`;
  return html;
}
function readNext(){ if(state.chapterRead < me().chapters.length){ state.chapterRead++; render(); } }

function renderChars(){
  let html=`<div class="section-title"><span class="num">02</span> 大厅 · 自我介绍</div>
    <div class="section-sub">六人各报身份。只有你的秘密是摊开的，别人的底细要靠你去挖。怀疑度会随线索变化。</div>
    <div class="dm-note"><b>阶段提示：</b>先记下每个人的说辞，再去搜证、审讯。你的角色卡已高亮。</div>
    <div class="chars-grid">`;
  ALL.forEach(c=>{
    const isSelf=c.id===state.playerId;
    const susp=Math.round(state.suspicion[c.id]||0);
    html+=`<div class="char-card ${isSelf?'self':''}" style="--c:${c.color}">
      <div class="head"><div class="mono" style="border-color:${c.color}">${c.name[0]}</div>
        <div class="who"><div class="nm">${c.name}</div><div class="role">${c.role}</div></div></div>
      <div class="body">${c.selfIntro}<br><br>${c.public}</div>
      <div class="susp"><div class="lbl"><span>怀疑度</span><span>${susp}%</span></div><div class="progress"><div style="width:${susp}%;background:${susp>50?'var(--blood)':'var(--blue)'}"></div></div></div>
      <div class="foot">${isSelf?'【这是你】秘密仅你可见':'秘密：？？？ — 需审讯挖取'}</div></div>`;
  });
  html+='</div>';
  return html;
}

function renderSearch(){
  const maxLayer = state.round===1?3:5;
  let html=`<div class="section-title"><span class="num">03</span> 搜证现场</div>
    <div class="section-sub">20 个场景 · 100 条线索。每条线索搜证消耗 1 行动点。第一轮开放 L1-L3，第二轮开放 L4-L5 深层真相。注意：有些线索是陷阱，真假要你自己判断。</div>
    <div class="search-status">
      <div class="stat">剩余行动点 <b>${state.ap}</b></div>
      <div class="stat">已搜线索 <b>${state.cluesFound.size}</b> / 100</div>
      <div class="stat">当前轮次 <b>${state.round}</b></div>
      ${state.round===1?'<button class="btn ghost small" onclick="toRound2()">进入第二轮（深层线索）</button>':'<span class="stat" style="color:var(--blood)">深层线索已开放</span>'}
    </div>`;
  if(state.lastStory){
    html+=`<div class="card" style="margin-bottom:16px;border-left:3px solid var(--gold)">
      <h4 style="color:var(--gold);font-size:13px;letter-spacing:2px;margin-bottom:8px">最新发现 · 故事</h4>
      <p style="font-size:14px;line-height:2;color:var(--text)">${state.lastStory}</p>
      ${flagBtn(state.lastClueId)}
    </div>`;
  }
  html+=`<div class="scenes-grid">`;
  SCENES.forEach((s,si)=>{
    const found=s.clues.filter(c=>state.cluesFound.has(c.id)).length;
    const next=s.clues.find(c=>!state.cluesFound.has(c.id) && c.layer<=maxLayer);
    html+=`<div class="scene-card">
      <div class="sh"><div class="idx">${si+1}</div><div><div class="nm">${s.name}</div><div class="st">${s.desc} · ${found}/${s.clues.length}</div></div></div>
      <div class="clues">`;
    s.clues.forEach(c=>{
      const f=state.cluesFound.has(c.id);
      if(f) html+=`<div class="clue revealed">${c.text} <span class="tag L${c.layer}">L${c.layer}</span></div>`;
      else html+=`<div class="clue locked"><span class="tag L${c.layer}">L${c.layer}</span> ${c.layer<=maxLayer?'未搜证':'第二轮解锁'}</div>`;
    });
    html+=`</div><div class="foot"><span>${next?'下一条：'+next.title:'已搜尽'}</span>
      <button class="btn small ${next?'':'ghost'}" ${(next&&state.ap>0)?'':'disabled'} onclick="doSearch(${si})">搜证</button></div></div>`;
  });
  html+='</div>';
  return html;
}
function doSearch(si){
  if(state.ap<=0){ toast('行动点不足'); return; }
  const s=SCENES[si]; const maxLayer=state.round===1?3:5;
  const next=s.clues.find(c=>!state.cluesFound.has(c.id) && c.layer<=maxLayer);
  if(!next) return;
  state.ap--; state.cluesFound.add(next.id);
  state.lastStory=next.story; state.lastClueId=next.id;
  const ci=CLUES.findIndex(c=>c.id===next.id);
  if(ci>=0) state.fragFound.add(ci);
  if(next.pointTo && next.pointTo.length) next.pointTo.forEach(cid=>{ state.suspicion[cid]=Math.min(100,(state.suspicion[cid]||0)+18); });
  render();
}
function toRound2(){ state.round=2; render(); }

function renderStory(){
  const total=FRAGMENTS.length, got=state.fragFound.size, pct=Math.round(got/total*100);
  let html=`<div class="section-title"><span class="num">04</span> 故事采集</div>
    <div class="section-sub">搜证与审讯会逐步拼出完整故事。集齐 100 个碎片才能看清全部真相——但其中混着谣言与假记忆，真假要你自己甄别。</div>
    <div class="card collect-bar"><div class="lbl"><span>故事采集进度</span><span>${got} / ${total}</span></div><div class="progress"><div style="width:${pct}%"></div></div></div>
    <div class="frag-grid">`;
  FRAGMENTS.forEach((f,i)=>{
    const has=state.fragFound.has(i);
    html+=`<div class="frag ${has?'':'locked'}"><h4>${f.chapter} · ${f.title}</h4><p>${has?f.text:'尚未采集到这段记忆。'}</p>${has?flagBtn(f.id):''}</div>`;
  });
  html+='</div>';
  return html;
}

function renderInterro(){
  let html=`<div class="section-title"><span class="num">05</span> 审讯</div>
    <div class="section-sub">逐个盘问。他们会撒谎，握有关键线索时可出示证据戳穿。每次盘问消耗 1 行动点。</div>
    <div class="interro-layout"><div class="npc-list">`;
  ALL.filter(c=>c.id!==state.playerId).forEach(c=>{
    const cnt=Object.keys(state.asked[c.id]||{}).length;
    html+=`<button class="${state.curNPC===c.id?'active':''}" onclick="pickNPC('${c.id}')"><span class="mono" style="border:2px solid ${c.color}">${c.name[0]}</span>${c.name}${cnt>0?'<span class="done">✓'+cnt+'</span>':''}</button>`;
  });
  html+=`</div><div class="interro-panel">${panelHtml()}</div></div>`;
  html+=`<div class="card" style="margin-top:14px"><h4 style="color:var(--gold);font-size:13px;margin-bottom:8px">证词与真相记录</h4>${logHtml()}</div>`;
  return html;
}
function panelHtml(){
  if(!state.curNPC) return '<p style="color:var(--muted);font-size:13px">选择左侧一名角色开始盘问。</p>';
  const c=cById(state.curNPC);
  return `<h3 style="font-size:15px;margin-bottom:3px">审讯 · ${c.name}</h3><div style="color:var(--muted);font-size:11px;margin-bottom:12px">${c.role}</div>
    <div class="topic-row">${TOPICS.map((q,ti)=>`<button class="topic-btn ${state.asked[c.id]?.[ti]?'asked':''}" onclick="ask('${c.id}',${ti})">${q}</button>`).join('')}</div>
    <div id="sayArea"><p style="color:var(--muted);font-size:13px">选择一个话题开始盘问。</p></div>`;
}
function ask(charId, ti){
  if(state.ap<=0){ toast('行动点不足'); return; }
  const c=cById(charId); const tm=c.testimony['T'+(ti+1)];
  state.ap--; if(!state.asked[charId]) state.asked[charId]={}; state.asked[charId][ti]=true;
  const exposed=state.confronts.has(charId+':'+ti);
  let h=`<div class="say-box ${exposed?'truth':''}"><div class="spk">${exposed?'已戳穿的真相':c.name+' 说'}</div><p>${exposed?tm.truth:tm.say}</p></div>`;
  if(tm.lie && !exposed && tm.exposeBy && state.cluesFound.has(tm.exposeBy)){
    const cl=clueById(tm.exposeBy);
    h+=`<div class="confront"><p>你握着能戳穿这段谎言的关键线索——</p><button class="btn small gold" onclick="confront('${charId}',${ti})">出示证据：「${cl.title}」</button></div>`;
  } else if(tm.lie && !exposed){
    h+=`<div style="color:var(--muted);font-size:11px;margin-bottom:10px">（对方似乎有所隐瞒，但你没有能戳穿它的证据。）</div>`;
  }
  render();
  const area=$('sayArea'); if(area) area.innerHTML=h;
}
function confront(charId, ti){
  state.confronts.add(charId+':'+ti);
  if(charId==='xinxin') state.truthUnlocked=true;
  const c=cById(charId); const tm=c.testimony['T'+(ti+1)];
  const extra=Math.floor(Math.random()*FRAGMENTS.length);
  state.fragFound.add(extra);
  render();
  const area=$('sayArea');
  if(area) area.innerHTML=`<div class="say-box truth"><div class="spk">真相 · ${c.name} 崩溃了</div><p>${tm.truth}</p></div><div class="truth-frag">✓ 真相片段已记录，故事采集 +1。</div>`;
}
function logHtml(){
  let h=''; let any=false;
  ALL.filter(c=>c.id!==state.playerId).forEach(c=>{
    Object.keys(state.asked[c.id]||{}).forEach(ti=>{
      const tm=c.testimony['T'+(+ti+1)]; if(!tm) return; any=true;
      const ex=state.confronts.has(c.id+':'+ti);
      h+=`<div class="clue ${ex?'revealed':''}" style="color:${ex?'var(--green)':'var(--muted)'}"><b style="color:${c.color}">${c.name}</b> · ${TOPICS[ti]}：${ex?'【真相】'+tm.truth:tm.say}</div>`;
    });
  });
  if(!any) h='<div style="color:var(--muted);font-size:12px">尚未取得任何证词。</div>';
  return h;
}
function pickNPC(id){ state.curNPC=id; render(); }

function renderTimeline(){
  let html=`<div class="section-title"><span class="num">06</span> 案件时间线</div>
    <div class="section-sub">公开时间线已被暴雨冲刷得支离破碎；被隐藏的真相，只有戳穿「白蔷薇」的谎言后才浮现。</div>
    <div class="timeline">`;
  TIMELINE.forEach(item=>{
    let ev=item.ev;
    if(item.hide && !state.truthUnlocked) ev=`<span class="blur">${item.ev}</span>`;
    else if(item.hide) ev=`<span class="unlocked">${item.ev}</span>`;
    html+=`<div class="tl-item ${item.hide?'hide':''}"><div class="tt">${item.t}</div><div class="ev">${ev}</div></div>`;
  });
  html+='</div>';
  return html;
}

let codexTab='mech';
function renderCodex(){
  let html=`<div class="section-title"><span class="num">07</span> 图鉴</div>
    <div class="section-sub">50 种玩法机制 + 线索图鉴 + 人物图鉴。</div>
    <div class="tab-switch">
      <button class="${codexTab==='mech'?'active':''}" onclick="codexTab='mech';render()">玩法机制（50）</button>
      <button class="${codexTab==='clue'?'active':''}" onclick="codexTab='clue';render()">线索图鉴（${state.cluesFound.size}/100）</button>
      <button class="${codexTab==='char'?'active':''}" onclick="codexTab='char';render()">人物图鉴</button>
    </div>`;
  if(codexTab==='mech'){
    html+='<div class="mech-grid">';
    MECHANICS.forEach((m,i)=>html+=`<div class="mech"><h4><span class="idx">${String(i+1).padStart(2,'0')}</span>${m.name}</h4><p>${m.desc}</p></div>`);
    html+='</div>';
  } else if(codexTab==='clue'){
    html+='<div class="card">';
    if(state.cluesFound.size===0) html+='<p style="color:var(--muted);font-size:12px">尚未搜到任何线索。</p>';
    else [...state.cluesFound].forEach(id=>{ const c=clueById(id); if(c) html+=`<div style="padding:12px 0;border-bottom:1px dashed var(--line)"><div style="font-size:13px;color:var(--text)"><b>【${c.scene}】${c.title}</b> <span class="tag L${c.layer}">L${c.layer}</span></div><p style="font-size:12px;color:var(--muted);margin:6px 0">${c.text}</p><p style="font-size:13px;line-height:1.9;color:var(--text)">${c.story}</p>${flagBtn(c.id)}</div>`; });
    html+='</div>';
  } else {
    html+='<div class="chars-grid">';
    ALL.forEach(c=>{
      const isSelf=c.id===state.playerId;
      html+=`<div class="char-card ${isSelf?'self':''}" style="--c:${c.color}"><div class="head"><div class="mono" style="border-color:${c.color}">${c.name[0]}</div><div class="who"><div class="nm">${c.name}</div><div class="role">${c.role}</div></div></div>
        <div class="body">${isSelf?c.secret:'【秘密未揭露 — 需审讯与搜证】'}</div>
        <div class="foot">${isSelf?'这是你自己':''}</div></div>`;
    });
    html+='</div>';
  }
  return html;
}

function renderVote(){
  const allocated = Object.values(state.ballot).reduce((a,b)=>a+b,0);
  const remaining = state.votes - allocated;
  const targets = ALL.map(c=>({id:c.id,name:c.name,role:c.role,color:c.color}));
  targets.push({id:'all',name:'五人都有罪',role:'特殊投票',color:''});
  targets.push({id:'none',name:'弃权',role:'特殊投票',color:''});
  let html=`<div class="section-title"><span class="num">09</span> 最终投票</div>
    <div class="section-sub">你共有 ${state.votes} 张选票，可任意分配。每用 1 张票可换 10 行动点，但凶手护盾会 +1 —— 最终投给「白蔷薇」的票数，必须大于护盾数才能定罪。</div>
    <div class="search-status">
      <div class="stat">剩余未分配票 <b>${remaining}</b></div>
      <div class="stat">凶手护盾 <b>${state.shields}</b></div>
      <div class="stat">行动点 <b>${state.ap}</b></div>
      <button class="btn gold small" ${remaining>0?'':'disabled'} onclick="tradeVote()">用 1 张票换 10 行动点</button>
    </div>
    <div class="dm-note"><b>博弈规则：</b>护盾越厚，指认真凶需要的票就越多。6 票全留且全投真凶可定罪；每换 1 次就多 1 盾、少 1 票。换到 3 次以上（盾 ≥ 3、票 ≤ 3），就算全票投真凶也赢不了。</div>
    <div class="vote-grid">`;
  targets.forEach(t=>{
    const n=state.ballot[t.id]||0;
    const mc = (t.id==='all'||t.id==='none') ? 'var(--gold)' : t.color;
    html+=`<div class="vote-opt ${n>0?'selected':''}">
      <div class="mono-sm" style="border-color:${mc};color:${mc}">${t.name[0]}</div>
      <div>${t.name}</div><small>${t.role}</small>
      <div style="margin-top:8px;display:flex;gap:6px;justify-content:center;align-items:center">
        <button class="btn ghost small" ${n>0?'':'disabled'} onclick="adjBallot('${t.id}',-1)">－</button>
        <b style="min-width:20px;color:var(--gold);font-size:16px">${n}</b>
        <button class="btn small" ${remaining>0?'':'disabled'} onclick="adjBallot('${t.id}',1)">＋</button>
      </div>
    </div>`;
  });
  html+=`</div>
    <div class="redeem-box ${canRedeem()?'':'disabled'}"><label><input type="checkbox" id="redeemChk" ${canRedeem()?'':'disabled'} ${state.redeem?'checked':''} onchange="state.redeem=this.checked"> 选择感化凶手，寻求救赎（仅当你以晨晨身份、集齐「第七封信」与「复仇笔记」时生效）</label></div>
    <div class="vote-submit"><button class="btn" onclick="doVote()">确认投票</button><button class="btn ghost" onclick="resetBallot()">清空分配</button></div>`;
  return html;
}
function canRedeem(){ return state.playerId==='chenchen' && state.cluesFound.has('e_letter') && state.cluesFound.has('e_revenge'); }
function adjBallot(id, d){
  const allocated = Object.values(state.ballot).reduce((a,b)=>a+b,0);
  const cur = state.ballot[id]||0;
  if(d>0 && allocated>=state.votes) return;
  if(d<0 && cur<=0) return;
  const nv = cur+d;
  if(nv<=0) delete state.ballot[id]; else state.ballot[id]=nv;
  render();
}
function tradeVote(){
  const allocated = Object.values(state.ballot).reduce((a,b)=>a+b,0);
  if(state.votes - allocated <= 0){ toast('没有未分配的票可换'); return; }
  state.votes--; state.shields++; state.ap+=10;
  render();
}
function resetBallot(){ state.ballot={}; render(); }
function doVote(){
  const total = Object.values(state.ballot).reduce((a,b)=>a+b,0);
  if(total<=0){ toast('请先分配你的选票'); return; }
  state.curTab='ending'; buildNav(); render();
}

function computeEnding(){
  const total = Object.values(state.ballot).reduce((a,b)=>a+b,0);
  if(total<=0) return null;
  const p = state.ballot['xinxin']||0;
  const all = state.ballot['all']||0;
  if(state.playerId==='chenchen' && state.cluesFound.has('e_letter') && state.cluesFound.has('e_revenge') && state.redeem) return 'e4';
  if(all>=3) return 'e3';
  if(p > state.shields) return 'e2';
  return 'e1';
}
function renderEnding(){
  const hit=computeEnding();
  let html=`<div class="section-title"><span class="num">10</span> 结局</div>`;
  if(!hit){
    html+=`<div class="section-sub">你的结局尚未揭晓。</div>
      <div class="dm-note"><b>提示：</b>请先到「投票」页做出选择，才能看到属于你的那一个结局。</div>`;
    return html;
  }
  const e=ENDINGS.find(x=>x.id===hit);
  const score=Math.min(100, Math.round(state.cluesFound.size + state.fragFound.size/2 + state.confronts.size*5));
  const grade=score>=90?'S':score>=70?'A':score>=50?'B':score>=30?'C':'D';
  const ts=truthScore();
  html+=`<div class="score-box"><div class="grade">${grade}</div>
    <div class="detail">推理完整度 ${score} 分 · 已搜线索 ${state.cluesFound.size}/100 · 已采故事 ${state.fragFound.size}/100 · 戳穿谎言 ${state.confronts.size} 个</div></div>
    <div class="dm-note"><b>投票结算：</b>白蔷薇得票 ${state.ballot['xinxin']||0} 票 vs 凶手护盾 ${state.shields} 层（换票 ${6-state.votes} 次）· 五人都有罪 ${state.ballot['all']||0} 票。${(state.ballot['xinxin']||0)>state.shields?'护盾被击破，真凶伏法。':((state.ballot['xinxin']||0)>0?'护盾挡住了你的指控。':'你没有把票投给真凶。')}</div>
    <div class="dm-note"><b>真假甄别：</b>你共审视了 ${ts.seen} 条信息，标记存疑 ${state.flagged.size} 条，判断正确 ${ts.correct} 条，准确率 ${ts.pct}%。</div>
    <div class="ending unlocked" style="margin-bottom:20px">
      <div class="badge ${e.badge}">${e.type}</div>
      <div class="e-title">${e.title}</div>
      <div class="e-type">你的专属结局</div>
      <div class="e-text">${(ENDING_FULL[hit]||e.text).split('\n').map(l=>`<p style="margin:8px 0;font-size:13px;line-height:2">${l}</p>`).join('')}</div>
    </div>`;
  const m=me();
  html+=`<div class="recap"><h3>完整真相复盘</h3>
    <div class="r-block"><h4>死者与死因</h4><p>苏念（山庄看护人，白月光的亲姐姐），当晚 21:00–21:15 在反锁书房被一刀刺入心口致死，死后被摆成祈祷姿势、口中塞满信纸残页。</p></div>
    <div class="r-block"><h4>真凶</h4><p>「白蔷薇」就是三年前「已死」的白月光芯芯。她重度烧伤毁容后假死隐姓埋名，三年后回山庄复仇。苏念认出她还活着，要带她自首——芯芯为保住复仇计划，亲手杀死了姐姐。</p></div>
    <div class="r-block"><h4>密室手法</h4><p>芯芯用偷配的备用钥匙开门行凶，再用钓鱼线穿过钥匙圈、借地毯下的磁铁把钥匙送回死者掌心，伪造「密室」。证据：门底缝鱼线纤维、地毯下磁铁、钓线残段。</p></div>
    <div class="r-block"><h4>三年前的旧案</h4><p>伟伟为霸占《第七封信》并骗保纵火烧了芯芯的工作室；恩恩提供钥匙与助燃剂；沈墨收钱把纵火鉴定为意外；顾钊受贿压案。只有晨晨与旧案无关。</p></div>
    <div class="r-block"><h4>你的身份</h4><p>你本局扮演「${m.name}」。${m.secret}</p></div></div>
    <div class="dm-note" style="margin-top:14px"><b>关于其它结局：</b>本局只向你揭晓你达成的一个结局；其余三种结局的剧情，需要换一个角色、换一种选择，才能解锁。</div>`;
  return html;
}

function fmt(s){ const m=Math.floor(s/60),ss=s%60; return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss; }
function renderTimer(){ $('timer').textContent=fmt(state.timerSeconds); $('timer').classList.toggle('danger',state.timerSeconds<=300); }
function toggleTimer(){
  if(state.timerRunning){ state.timerRunning=false; clearInterval(state.timerInt); $('btnTimer').textContent='继续计时'; }
  else{ state.timerRunning=true; $('btnTimer').textContent='暂停'; state.timerInt=setInterval(tick,1000); }
}
function tick(){
  if(state.timerSeconds<=0){ state.timerRunning=false; clearInterval(state.timerInt); $('btnTimer').textContent='开始计时'; toast('时间到！请进入投票。'); state.curTab='vote'; buildNav(); render(); return; }
  state.timerSeconds--; state.apTick++;
  if(state.apTick%45===0 && state.ap<state.maxAp){ state.ap++; }
  renderTimer();
  const apv=$('apVal'); if(apv) apv.textContent=state.ap;
}
function toast(msg){ const d=document.createElement('div'); d.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--blood2);color:#fff;padding:11px 22px;border-radius:8px;z-index:99;font-size:13px'; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),1800); }

renderTimer();
</script>
</body>
</html>
